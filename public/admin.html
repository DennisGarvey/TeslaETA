<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin · Tesla ETA</title><link rel="icon" type="image/svg+xml" href="/favicon.svg"><script src="/assets/theme.js"></script><link rel="stylesheet" href="/assets/leaflet/leaflet.css"><link rel="stylesheet" href="/assets/style.css"><script defer src="/assets/leaflet/leaflet.js"></script><script type="module" src="/admin/app.js"></script></head><body class="admin-page"><header><a class="brand" href="/">Tesla ETA</a><div class="theme-switch" role="group" aria-label="Appearance"><button type="button" data-theme="auto" aria-label="Automatic appearance" title="Automatic appearance" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 21h8m-4-3v3"/></svg></button><button type="button" data-theme="light" aria-label="Light appearance" title="Light appearance" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg></button><button type="button" data-theme="dark" aria-label="Dark appearance" title="Dark appearance" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.3 15.3A8.5 8.5 0 0 1 8.7 3.7 8.5 8.5 0 1 0 20.3 15.3Z"/></svg></button></div></header><main class="admin"><h1>Manage sharing</h1><nav class="admin-nav" aria-label="Administration"><button id="sharing-tab" aria-pressed="true">Sharing</button><button id="map-tab" aria-pressed="false">Map</button><button id="connection-tab" aria-pressed="false">MQTT connection</button><button id="settings-tab" aria-pressed="false">Settings</button></nav><div id="mqtt-alert" class="mqtt-alert" role="alert" hidden><span id="mqtt-alert-text"></span><button id="mqtt-alert-settings" type="button">Connection settings</button></div><div id="sharing-panel" class="admin-grid"><section class="panel"><h2>Create a link</h2><form id="share-form"><label>Vehicle<select id="car" required></select></label><label>Link name (optional)<input id="label" maxlength="100" placeholder="Link name"></label><label>Expires in<select id="hours"><option value="1">1 hour</option><option value="4" selected>4 hours</option><option value="12">12 hours</option><option value="24">1 day</option><option value="168">7 days</option></select></label><button id="create" type="submit">Create link</button></form><div id="created" hidden><input id="url" readonly aria-label="New sharing link"><div class="actions"><button id="copy" type="button">Copy link</button><button id="share" class="secondary icon-button" type="button" aria-label="Share link" title="Share link"></button><a id="open" target="_blank" rel="noreferrer">Open link</a></div></div><p id="message" role="status"></p></section><section class="panel"><h2>Sharing links</h2><div id="shares"><p class="muted">Loading…</p></div></section></div><section id="connection-panel" class="panel connection-panel" hidden><div class="connection-heading"><h2>MQTT connection</h2><span id="mqtt-status" class="mqtt-status" role="status">Connecting</span></div><div class="connection-layout"><div class="connection-settings"><form id="connection-form" autocomplete="off"><label>Transport (from URL)<select id="transport" disabled><option value="websocket">MQTT over WebSocket</option><option value="mqtt">MQTT</option></select></label><div class="mqtt-url-field"><div class="mqtt-url-title"><label for="mqtt-url">MQTT URL</label><span class="mqtt-info"><button type="button" class="mqtt-info-trigger" aria-label="MQTT URL help" aria-describedby="mqtt-url-tip">i</button><span id="mqtt-url-tip" class="mqtt-info-tip" role="tooltip">Use mqtt:// or mqtts:// for MQTT, or ws:// or wss:// for MQTT over WebSocket. The URL selects the transport.</span></span></div><input id="mqtt-url" type="text" required placeholder="wss://mqtt.example.com/mqtt" spellcheck="false"></div><label>Broker username (optional)<input id="mqtt-user" autocomplete="off"></label><label>Broker password (optional)<input id="mqtt-password" type="password" autocomplete="new-password"><small id="mqtt-password-hint" class="saved-hint" hidden>Saved · leave blank to keep</small></label><label class="check-label"><input id="clear-password" type="checkbox"> Clear saved broker password</label><label id="cloudflare-option" class="check-label"><input id="cloudflare-enabled" type="checkbox"> Use Cloudflare Access service token</label><div id="cloudflare-fields" class="cloudflare-fields" hidden><label>Client ID<input id="cf-client-id" type="password" autocomplete="new-password"><small id="cf-client-id-hint" class="saved-hint" hidden>Saved · leave blank to keep</small></label><label>Client secret<input id="cf-client-secret" type="password" autocomplete="new-password"><small id="cf-client-secret-hint" class="saved-hint" hidden>Saved · leave blank to keep</small></label></div><button id="save-connection" type="submit">Save and connect</button></form><p id="connection-message" role="status"></p></div></div></section><section id="map-panel" class="panel fleet-panel" hidden aria-labelledby="fleet-heading"><div class="fleet-heading"><h3 id="fleet-heading">Vehicles</h3><span id="fleet-count"></span></div><div class="fleet-content"><div id="fleet-list" class="fleet-list"><p class="muted">Waiting for vehicle data.</p></div><div class="fleet-map-wrap"><div id="fleet-map" aria-label="Vehicle locations"></div><p id="fleet-map-empty" class="fleet-map-empty">Vehicle locations unavailable</p><button id="fleet-fit" class="map-button" hidden>Recenter</button></div></div></section><section id="settings-panel" class="panel" hidden><h2>Sharing URL</h2><form id="sharing-settings-form"><label>Public URL<input id="public-origin" type="url" required placeholder="https://eta.example.com" spellcheck="false"></lab
