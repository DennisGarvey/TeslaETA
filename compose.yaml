services:
  tesla-eta:
    image: ghcr.io/dennisgarvey/teslaeta:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /data/eta.sqlite
      ADMIN_AUTH_MODE: ${ADMIN_AUTH_MODE:-cloudflare}
      PORT: 3001
    ports:
      - '127.0.0.1:3001:3001'
    volumes:
      - eta-data:/data
volumes:
  eta-data:
